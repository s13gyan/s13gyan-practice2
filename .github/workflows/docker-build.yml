name: Docker image build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/docker-practice-lab:latest
            ${{ vars.DOCKERHUB_USERNAME }}/docker-practice-lab:${{ github.sha }}

      - name: Run and verify published image
        env:
          IMAGE_TAG: ${{ vars.DOCKERHUB_USERNAME }}/docker-practice-lab:${{ github.sha }}
        run: |
          docker pull "$IMAGE_TAG"
          container_id=$(docker run --detach --publish 127.0.0.1:3001:3001 "$IMAGE_TAG")
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          ready=false
          response=''
          for attempt in {1..15}; do
            if response=$(curl --fail --silent --connect-timeout 2 --max-time 2 http://127.0.0.1:3001/api/health); then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            docker logs "$container_id"
            echo "Health endpoint did not become ready after 15 attempts." >&2
            exit 1
          fi

          printf '%s\n' "$response"
          if ! printf '%s\n' "$response" | grep -q '"status":"ok"'; then
            docker logs "$container_id"
            echo "Health endpoint returned an unexpected response." >&2
            exit 1
          fi

          docker image ls "$IMAGE_TAG"

      - name: Show published image
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/docker-practice-lab
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published Docker image"
            echo ""
            echo "- \`$IMAGE_NAME:latest\`"
            echo "- \`$IMAGE_NAME:${GITHUB_SHA}\`"
            echo "- **Digest:** \`$IMAGE_DIGEST\`"
            echo "- **Container health check:** passed"
            echo ""
            echo "Published to Docker Hub and verified by running the SHA-tagged image."
          } >> "$GITHUB_STEP_SUMMARY"
