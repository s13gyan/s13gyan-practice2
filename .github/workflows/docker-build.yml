name: Docker image build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/docker-practice-lab:latest
            ${{ vars.DOCKERHUB_USERNAME }}/docker-practice-lab:${{ github.sha }}

      - name: Show published image
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/s13gyandocker-practice-lab2
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published Docker image"
            echo ""
            echo "- \`$IMAGE_NAME:latest\`"
            echo "- \`$IMAGE_NAME:${GITHUB_SHA}\`"
            echo "- **Digest:** \`$IMAGE_DIGEST\`"
            echo ""
            echo "Published to Docker Hub."
          } >> "$GITHUB_STEP_SUMMARY"
